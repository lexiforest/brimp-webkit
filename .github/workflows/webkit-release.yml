name: WebKit and JavaScriptCore release

on:
  push:
    tags:
      - "webkit-v-*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing webkit-v-* tag to build and release
        required: true
        type: string

permissions:
  contents: read

env:
  MACOSX_DEPLOYMENT_TARGET: "26.0"
  RELEASE_TAG: >-
    ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

concurrency:
  group: webkit-release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Resolve release tag
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.revision.outputs.commit }}
      version: ${{ steps.revision.outputs.version }}
    steps:
      - name: Validate tag name
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^webkit-v-[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || {
            echo 'Expected an existing webkit-v-* tag' >&2
            exit 1
          }
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Record release commit
        id: revision
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#webkit-v-}" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Test release packaging
        run: |
          python3 -m pip install pytest
          python3 -m pytest Tools/Scripts/test_package_webkit_sdk.py -q

  build:
    name: JSC ${{ matrix.name }}
    needs: validate
    env:
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-linux-gnu
            runner: ubuntu-24.04
            os: linux
            arch: x64
            manylinux_image: quay.io/pypa/manylinux_2_28_x86_64
            build_dir: WebKitBuild/JSCOnly/Release
          - name: aarch64-linux-gnu
            runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            manylinux_image: quay.io/pypa/manylinux_2_28_aarch64
            build_dir: WebKitBuild/JSCOnly/Release
          - name: x86_64-win32
            runner: windows-2022
            os: windows
            arch: x64
            build_dir: WebKitBuild/Release
          - name: arm64-macos
            runner: xcode-27
            os: macos
            arch: arm64
            build_dir: WebKitBuild/JSCOnly/Release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - name: Build on manylinux 2.28
        if: matrix.os == 'linux'
        shell: bash
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            "${{ matrix.manylinux_image }}" \
            bash Tools/Scripts/build-jsc-manylinux.sh \
              "${{ matrix.build_dir }}"

      - name: Install macOS dependencies
        if: matrix.os == 'macos'
        run: |
          sudo xcode-select --switch /Applications/Xcode_27.2.app
          xcodebuild -version
          brew install icu4c ninja

      - name: Configure and build on macOS
        if: matrix.os == 'macos'
        shell: bash
        run: |
          icu_prefix="$(brew --prefix icu4c)"
          cmake -S . -B "${{ matrix.build_dir }}" \
            -G Ninja \
            -DPORT=JSCOnly \
            -DCMAKE_BUILD_TYPE=Release \
            -DDEVELOPER_MODE=ON \
            -DDEVELOPER_MODE_FATAL_WARNINGS=OFF \
            -DENABLE_API_TESTS=OFF \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            '-DCMAKE_BUILD_RPATH=@loader_path/../lib' \
            -DCMAKE_BUILD_WITH_INSTALL_NAME_DIR=ON \
            '-DCMAKE_INSTALL_NAME_DIR=@rpath' \
            "-DCMAKE_PREFIX_PATH=$icu_prefix"
          cmake --build "${{ matrix.build_dir }}" \
            --target jsc \
            --parallel

      - name: Configure and build on Windows
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $ninja = (Get-Command ninja.exe -ErrorAction Stop).Source
          $ninjaDirectory = Split-Path $ninja
          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -version "[17.0,18.0)" `
            -property installationPath
          $devShell = Join-Path $vs `
            "Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Import-Module $devShell
          $arguments = "-arch=${{ matrix.arch }} " + `
            "-host_arch=${{ matrix.arch }}"
          Enter-VsDevShell -VsInstallPath $vs `
            -SkipAutomaticLocation `
            -DevCmdArguments $arguments
          $env:PATH = "$ninjaDirectory;$env:PATH"
          Write-Host "Using Ninja at $ninja"
          $llvmRoot = Join-Path $env:ProgramFiles "LLVM"
          $clangCl = Join-Path $llvmRoot "bin\clang-cl.exe"
          $builtinsArch = if ("${{ matrix.arch }}" -eq "arm64") {
            "aarch64"
          } else {
            "x86_64"
          }
          $builtins = Join-Path $llvmRoot `
            "lib\clang\*\lib\windows\clang_rt.builtins-$builtinsArch.lib"
          if (-not (Test-Path $clangCl)) {
            throw "clang-cl was not found at $clangCl"
          }
          if (-not (Test-Path $builtins)) {
            throw "clang compiler-rt builtins were not found at $builtins"
          }
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          $toolchain = Join-Path $env:VCPKG_ROOT `
            "scripts\buildsystems\vcpkg.cmake"
          $triplet = "${{ matrix.arch }}-windows-webkit"
          $PSNativeCommandUseErrorActionPreference = $false
          cmake -S . -B "${{ matrix.build_dir }}" `
            -G Ninja `
            -DPORT=JSCOnly `
            -DCMAKE_BUILD_TYPE=Release `
            -DDEVELOPER_MODE=ON `
            -DDEVELOPER_MODE_FATAL_WARNINGS=OFF `
            -DENABLE_API_TESTS=OFF `
            "-DCMAKE_C_COMPILER=$clangCl" `
            "-DCMAKE_CXX_COMPILER=$clangCl" `
            "-DCMAKE_MAKE_PROGRAM=$ninja" `
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain" `
            "-DVCPKG_TARGET_TRIPLET=$triplet"
          $configureExitCode = $LASTEXITCODE
          if ($configureExitCode -ne 0) {
            $manifestLog = Join-Path "${{ matrix.build_dir }}" `
              "vcpkg-manifest-install.log"
            if (Test-Path $manifestLog) {
              Write-Host "::group::vcpkg manifest install log"
              Get-Content $manifestLog
              Write-Host "::endgroup::"
            }
            throw "CMake configuration failed: $configureExitCode"
          }
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --build "${{ matrix.build_dir }}" `
            --target jsc `
            --parallel

      - name: Smoke-test and package Unix build
        if: matrix.os != 'windows'
        shell: bash
        run: |
          build="${{ matrix.build_dir }}"
          package="javascriptcore-v$RELEASE_VERSION.${{ matrix.name }}"
          stage="$RUNNER_TEMP/$package"
          runtime_args=()
          if [[ "${{ matrix.os }}" == "linux" ]]; then
            runtime_args+=(
              --runtime-lib-dir
              WebKitBuild/Dependencies/icu/lib
              --glibc-baseline
              2.28
            )
          fi
          python3 Tools/Scripts/package-jsc-sdk.py \
            --build-dir "$build" \
            --output-dir "$stage" \
            --platform "${{ matrix.os }}" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --target "${{ matrix.name }}" \
            "${runtime_args[@]}"
          if [[ "${{ matrix.os }}" == "macos" ]]; then
            framework="$stage/lib/JavaScriptCore.framework/JavaScriptCore"
            install_name="$(otool -D "$framework" | tail -n 1)"
            deployment_target="$(otool -l "$framework" | awk '$1 == "minos" { print $2; exit }')"
            [[ "$install_name" == @rpath/JavaScriptCore.framework/* ]]
            [[ "$deployment_target" == "$MACOSX_DEPLOYMENT_TARGET" ]]
            "$stage/bin/jsc" -e 'print("JSC smoke test passed")'
          else
            python3 Tools/Scripts/check-glibc-baseline.py \
              --maximum 2.28 \
              "$stage/bin/jsc" \
              "$stage/lib"
            "$stage/bin/jsc" -e 'print("JSC smoke test passed")'
          fi
          consumer_build="$RUNNER_TEMP/jsc-sdk-consumer"
          cmake -S .github/jsc-sdk-smoke -B "$consumer_build" \
            -G Ninja \
            "-DCMAKE_PREFIX_PATH=$stage"
          cmake --build "$consumer_build" --parallel
          "$consumer_build/jsc-sdk-smoke"
          tar -C "$RUNNER_TEMP" -czf "$package.tar.gz" "$package"

      - name: Smoke-test and package Windows build
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $build = "${{ matrix.build_dir }}"
          $package = "javascriptcore-v$env:RELEASE_VERSION.${{ matrix.name }}"
          $stage = Join-Path $env:RUNNER_TEMP $package
          $symbolsPackage = "$package.symbols"
          $symbolsStage = Join-Path $env:RUNNER_TEMP $symbolsPackage
          python Tools/Scripts/package-jsc-sdk.py `
            --build-dir $build `
            --output-dir $stage `
            --symbols-output-dir $symbolsStage `
            --platform windows `
            --tag $env:RELEASE_TAG `
            --commit $env:RELEASE_COMMIT `
            --target "${{ matrix.name }}"
          & "$stage\bin\jsc.exe" -e 'print("JSC smoke test passed")'

          $ninja = (Get-Command ninja.exe -ErrorAction Stop).Source
          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -version "[17.0,18.0)" `
            -property installationPath
          $devShell = Join-Path $vs `
            "Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Import-Module $devShell
          Enter-VsDevShell -VsInstallPath $vs `
            -SkipAutomaticLocation `
            -DevCmdArguments "-arch=x64 -host_arch=x64"
          $clangCl = Join-Path $env:ProgramFiles "LLVM\bin\clang-cl.exe"
          $consumerBuild = Join-Path $env:RUNNER_TEMP `
            "jsc-sdk-consumer"
          cmake -S .github/jsc-sdk-smoke -B $consumerBuild `
            -G Ninja `
            "-DCMAKE_C_COMPILER=$clangCl" `
            "-DCMAKE_MAKE_PROGRAM=$ninja" `
            "-DCMAKE_PREFIX_PATH=$stage"
          cmake --build $consumerBuild --parallel
          $env:PATH = "$stage\bin;$env:PATH"
          & "$consumerBuild\jsc-sdk-smoke.exe"

          tar.exe -C $env:RUNNER_TEMP `
            -czf "$package.tar.gz" `
            $package
          tar.exe -C $env:RUNNER_TEMP `
            -czf "$symbolsPackage.tar.gz" `
            $symbolsPackage

      - name: Upload packaged build
        uses: actions/upload-artifact@v7
        with:
          name: javascriptcore-${{ matrix.name }}
          path: javascriptcore-v${{ env.RELEASE_VERSION }}.${{ matrix.name }}*.tar.gz
          if-no-files-found: error

  webkit:
    name: WebKit macOS arm64
    needs: validate
    runs-on: xcode-27
    timeout-minutes: 360
    env:
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out release sources
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
          # Omit the large browser test-data trees from this binary build.
          sparse-checkout: |
            .github
            Configurations
            Source
            Tools
            WebKit.xcworkspace
            WebKitLibraries
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Select Xcode and install Metal tools
        run: |
          sudo xcode-select --switch /Applications/Xcode_27.2.app
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain
          df -h .
      - name: Build frameworks and browser subprocesses
        shell: bash
        run: |
          set -o pipefail
          # Limit parallel compilation on the standard arm64 runner.
          # Exclude debug symbols and unrelated browser test tools.
          Tools/Scripts/build-webkit --release \
            '--only=Everything up to WebKit' -jobs 2 \
            DEBUG_INFORMATION_FORMAT= GCC_GENERATE_DEBUGGING_SYMBOLS=NO \
            MACOSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            COMPILATION_CACHE_ENABLE_CACHING=NO \
            2>&1 | tee "$RUNNER_TEMP/webkit-build.log"
      - name: Package WebKit SDK
        shell: bash
        run: |
          package="webkit-v$RELEASE_VERSION.arm64-macos"
          python3 Tools/Scripts/package-webkit-sdk.py \
            --build-dir WebKitBuild/Release \
            --output-dir "$RUNNER_TEMP/$package" \
            --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
          tar -C "$RUNNER_TEMP" -czf "$package.tar.gz" "$package"
      - name: Smoke-test extracted SDK without build products
        shell: bash
        run: |
          package="webkit-v$RELEASE_VERSION.arm64-macos"
          extracted="$RUNNER_TEMP/extracted-sdk"
          mkdir -p "$extracted"
          tar -xzf "$package.tar.gz" -C "$extracted"
          products="$GITHUB_WORKSPACE/WebKitBuild/Release"
          mv "$products" "$products.hidden"
          trap 'mv "$products.hidden" "$products"' EXIT
          python3 Tools/Scripts/test-webkit-sdk.py "$extracted/$package"
      - name: Upload WebKit archive
        uses: actions/upload-artifact@v7
        with:
          name: webkit-arm64-macos
          path: webkit-v${{ env.RELEASE_VERSION }}.arm64-macos.tar.gz
          if-no-files-found: error
          compression-level: 0
      - name: Upload WebKit build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: webkit-arm64-macos-log
          path: ${{ runner.temp }}/webkit-build.log
          if-no-files-found: ignore

  webkit-linux:
    name: WebKit Linux x64 (Ubuntu 24.04)
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      BRIMP_BUILD_JOBS: "4"
      CCACHE_DISABLE: "1"
    steps:
      - name: Check out release sources
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
          sparse-checkout: |
            .github
            Source
            Tools
            WebKitLibraries
      - name: Install Linux build and test dependencies
        shell: bash
        run: |
          # Free unused preinstalled SDKs on this disposable hosted runner.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get build-dep -y --no-install-recommends webkit2gtk
          sudo apt-get install -y --no-install-recommends \
            clang-18 lld-18 ccache cmake ninja-build unifdef nasm \
            xvfb xauth dbus-x11 python3-venv \
            curl pkg-config git ca-certificates bubblewrap xdg-dbus-proxy apparmor apparmor-profiles
          sudo apt-get clean
          python3 -m venv "$RUNNER_TEMP/webkit-tests"
          "$RUNNER_TEMP/webkit-tests/bin/python" -m pip install \
            'pytest>=8,<10' 'websockets>=12,<17' 'h2>=4,<5'
          echo "$RUNNER_TEMP/webkit-tests/bin" >> "$GITHUB_PATH"
          sudo mkdir -p /opt/brimp
          sudo chown "$(id -u):$(id -g)" /opt/brimp
          df -h /opt/brimp
          # Fail before compiling if the runner image leaves insufficient space.
          test "$(df --output=avail -B1 /opt/brimp | tail -1)" -ge 12884901888
      - name: Enable and verify Bubblewrap sandbox
        shell: bash
        run: |
          # Ubuntu 24.04 restricts unprivileged user namespaces. Use its scoped
          # Bubblewrap policy; WebKit's process sandbox remains enabled.
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          bwrap --unshare-user --unshare-pid --ro-bind / / --proc /proc true
      - name: Build curl-impersonate and WebKitGTK
        shell: bash
        run: |
          set -o pipefail
          bash Tools/Scripts/linux-webkit/build.sh "$GITHUB_WORKSPACE" /opt/brimp \
            2>&1 | tee "$RUNNER_TEMP/webkit-linux-build.log"
      - name: Package Linux SDK
        shell: bash
        run: |
          package="webkit-v$RELEASE_VERSION.x86_64-linux-gnu"
          python3 Tools/Scripts/package-webkit-sdk.py \
            --platform linux --build-dir /opt/brimp/sdk/webkit-curl \
            --output-dir "$RUNNER_TEMP/$package" \
            --curl-build-dir /opt/brimp/build/curl \
            --curl-source-dir /opt/brimp/src/curl-impersonate \
            --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
          tar -C "$RUNNER_TEMP" -czf "$package.tar.gz" "$package"
      - name: Test extracted SDK without original build products
        shell: bash
        run: |
          set -o pipefail
          package="webkit-v$RELEASE_VERSION.x86_64-linux-gnu"
          sdk=/opt/brimp/sdk/webkit-curl
          products=/opt/brimp/build/webkit-curl
          mv "$sdk" "$sdk.hidden"
          mv "$products" "$products.hidden"
          relocated="$RUNNER_TEMP/relocated-webkit"
          trap 'rm -rf "$relocated"; mv "$sdk.hidden" "$sdk"; mv "$products.hidden" "$products"' EXIT
          mkdir "$relocated"
          tar -xzf "$package.tar.gz" -C "$relocated" --strip-components=1
          sed -i "s|$sdk|$relocated|g" "$relocated"/lib/pkgconfig/*.pc
          # Exercise runtime relocation as an unprivileged user with sandboxing enabled.
          bash Tools/Scripts/linux-webkit/test.sh "$relocated" \
            /opt/brimp/sdk/curl-impersonate-2.3.2 \
            2>&1 | tee "$RUNNER_TEMP/webkit-linux-tests.log"
      - name: Upload Linux WebKit archive
        uses: actions/upload-artifact@v7
        with:
          name: webkit-x86_64-linux-gnu
          path: webkit-v${{ env.RELEASE_VERSION }}.x86_64-linux-gnu.tar.gz
          if-no-files-found: error
          compression-level: 0
      - name: Upload Linux build and test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webkit-x86_64-linux-gnu-logs
          path: |
            ${{ runner.temp }}/webkit-linux-build.log
            ${{ runner.temp }}/webkit-linux-tests.log
          if-no-files-found: ignore

  macos26:
    name: Verify WebKit and JSC on macOS 26
    needs: [validate, build, webkit]
    runs-on: macos-26
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
          sparse-checkout: |
            .github
            Tools/Scripts
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v8
        with:
          name: javascriptcore-arm64-macos
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          name: webkit-arm64-macos
          path: artifacts
      - name: Run released engine binaries on the minimum OS
        run: |
          mkdir -p "$RUNNER_TEMP/sdk"
          tar -xzf "artifacts/javascriptcore-v$RELEASE_VERSION.arm64-macos.tar.gz" -C "$RUNNER_TEMP/sdk"
          tar -xzf "artifacts/webkit-v$RELEASE_VERSION.arm64-macos.tar.gz" -C "$RUNNER_TEMP/sdk"
          "$RUNNER_TEMP/sdk/javascriptcore-v$RELEASE_VERSION.arm64-macos/bin/jsc" -e 'if (6*7 !== 42) throw Error("JSC failed"); print("JSC macOS 26 passed")'
          python3 Tools/Scripts/test-webkit-sdk.py "$RUNNER_TEMP/sdk/webkit-v$RELEASE_VERSION.arm64-macos"

  release:
    name: Publish GitHub release
    needs: [validate, build, webkit, webkit-linux, macos26]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download packaged builds
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: |
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 7
          sha256sum ./*.tar.gz > SHA256SUMS

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            --verify-tag \
            --generate-notes
