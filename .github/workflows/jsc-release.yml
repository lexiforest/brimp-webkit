name: JavaScriptCore release

on:
  push:
    tags:
      - "jsc-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing jsc-v* tag to build and release
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: >-
    ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
            os: linux
            arch: x64
            manylinux_image: quay.io/pypa/manylinux_2_28_x86_64
            build_dir: WebKitBuild/JSCOnly/Release
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            manylinux_image: quay.io/pypa/manylinux_2_28_aarch64
            build_dir: WebKitBuild/JSCOnly/Release
          - name: windows-x64
            runner: windows-2025
            os: windows
            arch: x64
            build_dir: WebKitBuild/Release
          - name: macos-arm64
            runner: macos-26
            os: macos
            arch: arm64
            build_dir: WebKitBuild/JSCOnly/Release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Build on manylinux 2.28
        if: matrix.os == 'linux'
        shell: bash
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            "${{ matrix.manylinux_image }}" \
            bash Tools/Scripts/build-jsc-manylinux.sh \
              "${{ matrix.build_dir }}"

      - name: Install macOS dependencies
        if: matrix.os == 'macos'
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app
          xcodebuild -version
          brew install icu4c ninja

      - name: Configure and build on macOS
        if: matrix.os == 'macos'
        shell: bash
        run: |
          icu_prefix="$(brew --prefix icu4c)"
          cmake -S . -B "${{ matrix.build_dir }}" \
            -G Ninja \
            -DPORT=JSCOnly \
            -DCMAKE_BUILD_TYPE=Release \
            -DDEVELOPER_MODE=ON \
            -DDEVELOPER_MODE_FATAL_WARNINGS=OFF \
            -DENABLE_API_TESTS=OFF \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            '-DCMAKE_BUILD_RPATH=@loader_path/../lib' \
            -DCMAKE_BUILD_WITH_INSTALL_NAME_DIR=ON \
            '-DCMAKE_INSTALL_NAME_DIR=@rpath' \
            "-DCMAKE_PREFIX_PATH=$icu_prefix"
          cmake --build "${{ matrix.build_dir }}" \
            --target jsc \
            --parallel

      - name: Configure and build on Windows
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $ninja = (Get-Command ninja.exe -ErrorAction Stop).Source
          $ninjaDirectory = Split-Path $ninja
          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * `
            -property installationPath
          $devShell = Join-Path $vs `
            "Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Import-Module $devShell
          $arguments = "-arch=${{ matrix.arch }} " + `
            "-host_arch=${{ matrix.arch }}"
          Enter-VsDevShell -VsInstallPath $vs `
            -SkipAutomaticLocation `
            -DevCmdArguments $arguments
          $env:PATH = "$ninjaDirectory;$env:PATH"
          Write-Host "Using Ninja at $ninja"
          $llvmRoot = Join-Path $env:ProgramFiles "LLVM"
          $clangCl = Join-Path $llvmRoot "bin\clang-cl.exe"
          $builtinsArch = if ("${{ matrix.arch }}" -eq "arm64") {
            "aarch64"
          } else {
            "x86_64"
          }
          $builtins = Join-Path $llvmRoot `
            "lib\clang\*\lib\windows\clang_rt.builtins-$builtinsArch.lib"
          if (-not (Test-Path $clangCl)) {
            throw "clang-cl was not found at $clangCl"
          }
          if (-not (Test-Path $builtins)) {
            throw "clang compiler-rt builtins were not found at $builtins"
          }
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          $toolchain = Join-Path $env:VCPKG_ROOT `
            "scripts\buildsystems\vcpkg.cmake"
          $triplet = "${{ matrix.arch }}-windows-webkit"
          $PSNativeCommandUseErrorActionPreference = $false
          cmake -S . -B "${{ matrix.build_dir }}" `
            -G Ninja `
            -DPORT=JSCOnly `
            -DCMAKE_BUILD_TYPE=Release `
            -DDEVELOPER_MODE=ON `
            -DDEVELOPER_MODE_FATAL_WARNINGS=OFF `
            -DENABLE_API_TESTS=OFF `
            "-DCMAKE_C_COMPILER=$clangCl" `
            "-DCMAKE_CXX_COMPILER=$clangCl" `
            "-DCMAKE_MAKE_PROGRAM=$ninja" `
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain" `
            "-DVCPKG_TARGET_TRIPLET=$triplet"
          $configureExitCode = $LASTEXITCODE
          if ($configureExitCode -ne 0) {
            $manifestLog = Join-Path "${{ matrix.build_dir }}" `
              "vcpkg-manifest-install.log"
            if (Test-Path $manifestLog) {
              Write-Host "::group::vcpkg manifest install log"
              Get-Content $manifestLog
              Write-Host "::endgroup::"
            }
            throw "CMake configuration failed: $configureExitCode"
          }
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --build "${{ matrix.build_dir }}" `
            --target jsc `
            --parallel

      - name: Smoke-test and package Unix build
        if: matrix.os != 'windows'
        shell: bash
        run: |
          build="${{ matrix.build_dir }}"
          package="JavaScriptCore-$RELEASE_TAG-${{ matrix.name }}"
          stage="$RUNNER_TEMP/$package"
          runtime_args=()
          if [[ "${{ matrix.os }}" == "linux" ]]; then
            runtime_args+=(
              --runtime-lib-dir
              WebKitBuild/Dependencies/icu/lib
              --glibc-baseline
              2.28
            )
          fi
          python3 Tools/Scripts/package-jsc-sdk.py \
            --build-dir "$build" \
            --output-dir "$stage" \
            --platform "${{ matrix.os }}" \
            --tag "$RELEASE_TAG" \
            --commit "$GITHUB_SHA" \
            --target "${{ matrix.name }}" \
            "${runtime_args[@]}"
          if [[ "${{ matrix.os }}" == "macos" ]]; then
            framework="$stage/lib/JavaScriptCore.framework/JavaScriptCore"
            install_name="$(otool -D "$framework" | tail -n 1)"
            deployment_target="$(otool -l "$framework" | awk '$1 == "minos" { print $2; exit }')"
            [[ "$install_name" == @rpath/JavaScriptCore.framework/* ]]
            [[ "$deployment_target" == 11.0 ]]
            "$stage/bin/jsc" -e 'print("JSC smoke test passed")'
          else
            python3 Tools/Scripts/check-glibc-baseline.py \
              --maximum 2.28 \
              "$stage/bin/jsc" \
              "$stage/lib"
            "$stage/bin/jsc" -e 'print("JSC smoke test passed")'
          fi
          consumer_build="$RUNNER_TEMP/jsc-sdk-consumer"
          cmake -S .github/jsc-sdk-smoke -B "$consumer_build" \
            -G Ninja \
            "-DCMAKE_PREFIX_PATH=$stage"
          cmake --build "$consumer_build" --parallel
          "$consumer_build/jsc-sdk-smoke"
          tar -C "$RUNNER_TEMP" -czf "$package.tar.gz" "$package"

      - name: Smoke-test and package Windows build
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $build = "${{ matrix.build_dir }}"
          $package = "JavaScriptCore-$env:RELEASE_TAG-${{ matrix.name }}"
          $stage = Join-Path $env:RUNNER_TEMP $package
          $symbolsPackage = "$package-symbols"
          $symbolsStage = Join-Path $env:RUNNER_TEMP $symbolsPackage
          python Tools/Scripts/package-jsc-sdk.py `
            --build-dir $build `
            --output-dir $stage `
            --symbols-output-dir $symbolsStage `
            --platform windows `
            --tag $env:RELEASE_TAG `
            --commit $env:GITHUB_SHA `
            --target "${{ matrix.name }}"
          & "$stage\bin\jsc.exe" -e 'print("JSC smoke test passed")'

          $ninja = (Get-Command ninja.exe -ErrorAction Stop).Source
          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * `
            -property installationPath
          $devShell = Join-Path $vs `
            "Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Import-Module $devShell
          Enter-VsDevShell -VsInstallPath $vs `
            -SkipAutomaticLocation `
            -DevCmdArguments "-arch=x64 -host_arch=x64"
          $clangCl = Join-Path $env:ProgramFiles "LLVM\bin\clang-cl.exe"
          $consumerBuild = Join-Path $env:RUNNER_TEMP `
            "jsc-sdk-consumer"
          cmake -S .github/jsc-sdk-smoke -B $consumerBuild `
            -G Ninja `
            "-DCMAKE_C_COMPILER=$clangCl" `
            "-DCMAKE_MAKE_PROGRAM=$ninja" `
            "-DCMAKE_PREFIX_PATH=$stage"
          cmake --build $consumerBuild --parallel
          $env:PATH = "$stage\bin;$env:PATH"
          & "$consumerBuild\jsc-sdk-smoke.exe"

          tar.exe -C $env:RUNNER_TEMP `
            -czf "$package.tar.gz" `
            $package
          tar.exe -C $env:RUNNER_TEMP `
            -czf "$symbolsPackage.tar.gz" `
            $symbolsPackage

      - name: Upload packaged build
        uses: actions/upload-artifact@v7
        with:
          name: JavaScriptCore-${{ matrix.name }}
          path: JavaScriptCore-${{ env.RELEASE_TAG }}-${{ matrix.name }}*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download packaged builds
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum JavaScriptCore-* > SHA256SUMS

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/JavaScriptCore-* \
            dist/SHA256SUMS \
            --verify-tag \
            --generate-notes
